<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Movie Reviews</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Movie Review App</h1>
        <nav>
            <a href="index.html">Add Review</a>
            <a href="search.html">Search Reviews</a>
        </nav>
    </header>
    <div class="container">
        <h2>Search Movie Reviews</h2> <!-- Changed from h1 -->
        <div>
            <input type="text" id="searchInput" placeholder="Search by movie title...">
            <button id="searchBtn">Search</button>
            <button id="clearSearchBtn">Clear</button>
        </div>
        <div id="reviewsContainer">
            <p>Loading reviews...</p>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 Movie Review App</p>
    </footer>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="script.js"></script>
</body>
</html>
